    <!-- Service Worker Registration for PWA & Offline Support with Auto-Update Strategy -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // updateViaCache: 'none' ensures the browser never caches sw.js itself
          navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' })
            .then((registration) => {
              window.__dailyKhataSwReg = registration;

              // Immediately check for updates from server
              registration.update().catch(() => {});

              // When a new service worker version is detected
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (!newWorker) return;

                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA Update] New version ready. Activating immediately...');
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });

              // Also check for updates whenever the user returns to this browser tab
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                  registration.update().catch(() => {});
                }
              });
            })
            .catch((error) => {
              console.warn('Service Worker registration error:', error);
            });

          // Reload smoothly when the new Service Worker claims control
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              console.log('[PWA] Service worker updated. Reloading with fresh assets...');
              window.location.reload();
            }
          });
        });

        // Global helper for user-triggered update and cache refresh
        window.__DAILY_KHATA_FORCE_REFRESH__ = async () => {
          try {
            if (window.__dailyKhataSwReg && window.__dailyKhataSwReg.active) {
              window.__dailyKhataSwReg.active.postMessage({ type: 'PURGE_CACHE' });
            }
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
            }
            window.location.reload(true);
          } catch (e) {
            window.location.reload();
          }
        };
      }
    </script>
