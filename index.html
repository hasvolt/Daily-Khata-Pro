      <script>
        (function() {
          var RECOVERY_KEY = 'khata_boot_recovery_attempt_v273';

          function showRecoveryUI(detail) {
            var card = document.getElementById('preloader-recovery-card');
            var loader = document.getElementById('preloader-loading-bar');
            var slow = document.getElementById('preloader-slow-notice');
            if (loader) loader.style.display = 'none';
            if (slow) slow.style.display = 'none';
            if (card) {
              card.style.display = 'flex';
              if (detail) {
                var detailEl = document.getElementById('preloader-error-detail');
                if (detailEl) {
                  detailEl.innerText = detail + ' (Your ledger data is completely safe. Tap below to refresh)';
                }
              }
            }
          }

          function handleBootError(reason) {
            console.warn('[Daily Khata Boot Guard] Captured boot error:', reason);
            // If the user is currently offline, NEVER wipe caches or force network reloads
            if (typeof navigator !== 'undefined' && navigator.onLine === false) {
              console.log('[Daily Khata] Offline mode active — skipping cache clear');
              return;
            }
            var attempted = sessionStorage.getItem(RECOVERY_KEY);
            if (!attempted) {
              // Auto-recovery: Silently reload once with cache-buster
              sessionStorage.setItem(RECOVERY_KEY, Date.now().toString());
              if (typeof window.__DAILY_KHATA_FORCE_REFRESH__ === 'function') {
                window.__DAILY_KHATA_FORCE_REFRESH__();
              } else {
                window.location.replace(window.location.origin + window.location.pathname + '?_fix=' + Date.now());
              }
            } else {
              showRecoveryUI(reason);
            }
          }

          // 1. Intercept resource errors (ignore non-critical LINK tag errors like Google Fonts offline)
          window.addEventListener('error', function(e) {
            var target = e.target;
            if (target && target.tagName === 'LINK') {
              // External stylesheets (e.g. Google Fonts) failing offline is expected and harmless
              return;
            }
            if (typeof navigator !== 'undefined' && navigator.onLine === false) {
              // Ignore offline fetch errors
              return;
            }
            if (target && target.tagName === 'SCRIPT') {
              var src = target.src || 'module';
              handleBootError('Script loading mismatch: ' + src.split('/').pop());
              return;
            }
            var msg = (e.message || '').toLowerCase();
            if (msg.indexOf('import') !== -1 || msg.indexOf('chunk') !== -1 || msg.indexOf('loading') !== -1 || msg.indexOf('syntaxerror') !== -1) {
              handleBootError('Module loading failure: ' + e.message);
            }
          }, true);

          // 2. Intercept unhandled promise rejections
          window.addEventListener('unhandledrejection', function(e) {
            if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
            var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
            var lower = reason.toLowerCase();
            if (lower.indexOf('import') !== -1 || lower.indexOf('chunk') !== -1 || lower.indexOf('fetch') !== -1 || lower.indexOf('dynamically') !== -1) {
              handleBootError('Chunk import rejected: ' + reason);
            }
          });

          // 3. Graceful check after 4.5s
          setTimeout(function() {
            var root = document.getElementById('root');
            var preloader = document.getElementById('app-preloader');
            if (preloader && preloader.style.display !== 'none') {
              if (!root || root.children.length === 0) {
                var slow = document.getElementById('preloader-slow-notice');
                if (slow) slow.style.display = 'block';
              }
            }
          }, 4500);

          // 4. Stuck protection after 10s: Show recovery card only if not mounted and not offline
          setTimeout(function() {
            var root = document.getElementById('root');
            var preloader = document.getElementById('app-preloader');
            if (preloader && preloader.style.display !== 'none') {
              if (!root || root.children.length === 0) {
                if (typeof navigator !== 'undefined' && navigator.onLine === false) {
                  // If offline, let it continue rendering cached shell
                  return;
                }
                showRecoveryUI('Network or module load timed out');
              }
            }
          }, 10000);
        })();
      </script>

    <!-- Service Worker Registration for PWA & Offline Support with Auto-Update Strategy -->
    <script>
      window.__APP_START_TIME__ = Date.now();
      window.__APP_MOUNTED__ = false;

      // Global helpers for user-triggered update, cache refresh, and hard reset
      window.__DAILY_KHATA_FORCE_REFRESH__ = async function() {
        try {
          if (typeof navigator !== 'undefined' && navigator.onLine === false) {
            window.location.reload();
            return;
          }
          if (window.__dailyKhataSwReg && window.__dailyKhataSwReg.active) {
            window.__dailyKhataSwReg.active.postMessage({ type: 'PURGE_CACHE' });
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }
          if (navigator.serviceWorker) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function(r) { return r.update(); }));
          }
          sessionStorage.clear();
          window.location.replace(window.location.origin + window.location.pathname + '?_v=' + Date.now());
        } catch (e) {
          window.location.replace(window.location.origin + window.location.pathname + '?_v=' + Date.now());
        }
      };

      window.__DAILY_KHATA_HARD_RESET__ = async function() {
        try {
          if (typeof navigator !== 'undefined' && navigator.onLine === false) {
            window.location.reload();
            return;
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }
          if (navigator.serviceWorker) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function(r) { return r.unregister(); }));
          }
          sessionStorage.clear();
          window.location.replace(window.location.origin + window.location.pathname + '?_reset=' + Date.now());
        } catch (e) {
          window.location.reload();
        }
      };

      // Register Service Worker across all environments for 100% offline capability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' })
            .then((registration) => {
              window.__dailyKhataSwReg = registration;

              // Immediately precache all currently loaded script and style tags into SW
              setTimeout(() => {
                try {
                  const assets = [];
                  document.querySelectorAll('script[src], link[rel="stylesheet"]').forEach((el) => {
                    const src = el.getAttribute('src') || el.getAttribute('href');
                    if (src && !src.startsWith('http') && !src.startsWith('//') && !src.includes('hot-update') && !src.includes('/src/') && !src.includes('/node_modules/') && !src.includes('@vite')) {
                      assets.push(src.startsWith('/') ? src : '/' + src);
                    }
                  });
                  if (assets.length > 0 && registration.active) {
                    registration.active.postMessage({ type: 'CACHE_URLS', urls: assets });
                  }
                } catch (e) {}
              }, 1500);

              // Immediately check for updates from server if online
              if (navigator.onLine) {
                registration.update().catch(() => {});
              }

              // When a new service worker version is detected
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (!newWorker) return;

                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA Update] New version ready. Activating immediately...');
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });

              // Check for updates when user returns to this browser tab
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                  registration.update().catch(() => {});
                }
              });
            })
            .catch((error) => {
              console.warn('Service Worker registration error:', error);
            });

          // Reload smoothly ONLY if the app has already successfully booted and mounted
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            // Only auto-reload if app has been running stably for at least 4 seconds
            if (window.__APP_MOUNTED__ && (Date.now() - (window.__APP_START_TIME__ || 0) > 4000)) {
              refreshing = true;
              console.log('[PWA] Service worker updated. Reloading with fresh assets...');
              window.location.reload();
            }
          });
        });
      }
    </script>
