<svg xmlns="http://www.w3.org/2000/svg" viewBox="42 42 428 428" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E33"/>
      <stop offset="50%" stop-color="#08111D"/>
      <stop offset="100%" stop-color="#03070E"/>
    </linearGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Ledger Cover Gradient -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="60%" stop-color="#12243B"/>
      <stop offset="100%" stop-color="#0A1624"/>
    </linearGradient>

    <!-- Gold Foil Rupee -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="35%" stop-color="#FFD000"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Emerald Growth Arrow -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Coral Outflow -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Cyan Electric Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="ledgerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.25"/>
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFC700" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 1. Squircle App Backdrop -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8"/>

  <!-- Background Decorative Grid Lines (Subtle Tech Texture) -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1.5">
    <line x1="80" y1="16" x2="80" y2="496"/>
    <line x1="160" y1="16" x2="160" y2="496"/>
    <line x1="240" y1="16" x2="240" y2="496"/>
    <line x1="320" y1="16" x2="320" y2="496"/>
    <line x1="400" y1="16" x2="400" y2="496"/>
    <line x1="16" y1="120" x2="496" y2="120"/>
    <line x1="16" y1="200" x2="496" y2="200"/>
    <line x1="16" y1="280" x2="496" y2="280"/>
    <line x1="16" y1="360" x2="496" y2="360"/>
    <line x1="16" y1="440" x2="496" y2="440"/>
  </g>

  <!-- Radial Glow Behind Ledger -->
  <circle cx="256" cy="256" r="160" fill="#38BDF8" opacity="0.12" filter="blur(30px)"/>

  <!-- 2. The Main Floating Khata Ledger Card / Book -->
  <g filter="url(#ledgerShadow)">
    <!-- Back Page Trim / Spine Layer -->
    <rect x="94" y="98" width="324" height="324" rx="36" fill="#0C1B2B" stroke="#224263" stroke-width="3"/>
    
    <!-- Inner Book Pages Layer -->
    <rect x="106" y="108" width="300" height="304" rx="30" fill="url(#coverGrad)" stroke="url(#rimGrad)" stroke-width="3"/>

    <!-- Left Spine Ribbon (Book Binder) -->
    <rect x="106" y="108" width="34" height="304" rx="6" fill="#0A1522"/>
    <line x1="140" y1="108" x2="140" y2="412" stroke="#38BDF8" stroke-width="2.5" opacity="0.6"/>
    <circle cx="123" cy="150" r="3.5" fill="#38BDF8" opacity="0.7"/>
    <circle cx="123" cy="210" r="3.5" fill="#38BDF8" opacity="0.7"/>
    <circle cx="123" cy="270" r="3.5" fill="#38BDF8" opacity="0.7"/>
    <circle cx="123" cy="330" r="3.5" fill="#38BDF8" opacity="0.7"/>
    <circle cx="123" cy="370" r="3.5" fill="#38BDF8" opacity="0.7"/>

    <!-- Ruled Ledger Lines (Financial Rows) -->
    <line x1="162" y1="160" x2="382" y2="160" stroke="#254366" stroke-width="4" stroke-linecap="round"/>
    <line x1="162" y1="210" x2="382" y2="210" stroke="#254366" stroke-width="4" stroke-linecap="round"/>
    <line x1="162" y1="260" x2="382" y2="260" stroke="#254366" stroke-width="4" stroke-linecap="round"/>
    <line x1="162" y1="310" x2="382" y2="310" stroke="#254366" stroke-width="4" stroke-linecap="round"/>
    <line x1="162" y1="360" x2="382" y2="360" stroke="#254366" stroke-width="4" stroke-linecap="round"/>

    <!-- 3. Central Golden Indian Rupee Sign ₹ (Precision Scaled & Embossed) -->
    <g id="RupeeSign" filter="url(#goldGlow)">
      <!-- Top Bar 1 -->
      <path d="M216 182 L320 182" stroke="url(#goldMetallic)" stroke-width="18" stroke-linecap="round"/>
      <!-- Mid Bar 2 -->
      <path d="M216 220 L300 220" stroke="url(#goldMetallic)" stroke-width="18" stroke-linecap="round"/>
      <!-- Loop & Diagonal Leg -->
      <path d="M246 182 C290 182 290 254 246 254 L228 254 L298 344" 
            stroke="url(#goldMetallic)" 
            stroke-width="18" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>

    <!-- 4. Top-Right Emerald Inflow Badge (Profit / Income Indicator) -->
    <g transform="translate(330, 114)">
      <circle cx="28" cy="28" r="28" fill="#06281E" stroke="#10B981" stroke-width="3.5"/>
      <path d="M18 36 L36 18 M24 18 L36 18 L36 30" stroke="url(#emeraldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 5. Bottom-Right Coral Expense Indicator (Balanced Double-Entry Khata) -->
    <g transform="translate(330, 326)">
      <circle cx="28" cy="28" r="28" fill="#2A0F14" stroke="#EF4444" stroke-width="3.5"/>
      <path d="M18 20 L36 38 M36 26 L36 38 L24 38" stroke="url(#coralGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- 6. Golden Star / Sparkle in Top-Left (Pro / Wealth Badge) -->
  <path d="M80 68 Q92 80 104 80 Q92 80 80 92 Q80 80 68 80 Q80 80 80 68 Z" fill="url(#goldMetallic)"/>
</svg>